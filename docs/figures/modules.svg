<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <!-- UI -->
  <rect x="320" y="30" width="360" height="86" rx="6" fill="#eef2f7" stroke="#3b4a5a" stroke-width="1.5"/>
  <text x="500" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2430">UI · edu.mentorj.ui</text>
  <text x="500" y="82" text-anchor="middle" font-size="13" fill="#333333">tool window, four actions,</text>
  <text x="500" y="100" text-anchor="middle" font-size="13" fill="#333333">editor context (Swing, PSI, EDT)</text>

  <!-- Agent -->
  <rect x="285" y="185" width="430" height="100" rx="6" fill="#eaf3ea" stroke="#3d5c3d" stroke-width="1.5"/>
  <text x="500" y="213" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2430">Agent core · edu.mentorj.agent</text>
  <text x="500" y="237" text-anchor="middle" font-size="13" fill="#333333">AgentLoop, system prompt, tool registry,</text>
  <text x="500" y="255" text-anchor="middle" font-size="13" fill="#333333">ChatCompletionsLlmService, settings</text>
  <text x="500" y="275" text-anchor="middle" font-size="12" fill="#555555">bounded tool loop, citations, cancellation</text>

  <!-- RAG -->
  <rect x="60" y="390" width="350" height="104" rx="6" fill="#f6efe6" stroke="#6b5330" stroke-width="1.5"/>
  <text x="235" y="418" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2430">Retrieval · edu.mentorj.rag</text>
  <text x="235" y="442" text-anchor="middle" font-size="13" fill="#333333">PDF parsing, chunking, tokenizer,</text>
  <text x="235" y="460" text-anchor="middle" font-size="13" fill="#333333">BM25 + embeddings, relevance gate</text>
  <text x="235" y="480" text-anchor="middle" font-size="12" fill="#555555">.idea/mentorj-index.json</text>

  <!-- Platform -->
  <rect x="610" y="390" width="330" height="104" rx="6" fill="#f2eef6" stroke="#4b3a5c" stroke-width="1.5"/>
  <text x="775" y="418" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2430">Tongji AI platform</text>
  <text x="775" y="442" text-anchor="middle" font-size="13" fill="#333333">Chat Completions (DeepSeek-V4.1-Flash)</text>
  <text x="775" y="460" text-anchor="middle" font-size="13" fill="#333333">Qwen3-Embedding</text>
  <text x="775" y="480" text-anchor="middle" font-size="12" fill="#555555">HTTPS, streamed responses</text>

  <!-- UI -> Agent -->
  <line x1="500" y1="116" x2="500" y2="183" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="145" font-size="12.5" fill="#333333">AgentRequest</text>
  <text x="512" y="163" font-size="12.5" fill="#333333">AgentResponse + deltas</text>

  <!-- Agent -> RAG -->
  <line x1="392" y1="285" x2="262" y2="388" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="316" y="322" text-anchor="end" font-size="12.5" fill="#333333">KnowledgeBase.retrieve</text>
  <text x="316" y="340" text-anchor="end" font-size="12.5" fill="#333333">Tool: search_course_material</text>

  <!-- Agent -> Platform -->
  <line x1="608" y1="285" x2="740" y2="388" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="686" y="326" font-size="12.5" fill="#333333">LlmService</text>
  <text x="686" y="344" font-size="12.5" fill="#333333">(chat + tool calls)</text>

  <!-- RAG -> Platform -->
  <line x1="410" y1="442" x2="608" y2="442" stroke="#333333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="500" y="434" text-anchor="middle" font-size="12.5" fill="#333333">embeddings</text>

  <!-- api contract -->
  <rect x="130" y="535" width="740" height="46" rx="6" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="500" y="555" text-anchor="middle" font-size="13" fill="#1b2430">edu.mentorj.api: interfaces and data types shared by all three modules</text>
  <text x="500" y="573" text-anchor="middle" font-size="12" fill="#555555">no module imports another; MentorJProjectService is the only class that wires concrete implementations</text>
</svg>
