<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Same palette as the plugin template this icon replaces. -->
        <linearGradient id="mentorj" x1="4" y1="3" x2="36" y2="36" gradientUnits="userSpaceOnUse">
            <stop offset="0.15937" stop-color="#3BEA62"/>
            <stop offset="0.5404" stop-color="#3C99CC"/>
            <stop offset="0.93739" stop-color="#6B57FF"/>
        </linearGradient>
    </defs>
    <!-- Mortarboard: the course context. -->
    <path d="M20 3.2 34 8.7 20 14.2 6 8.7Z" fill="url(#mentorj)"/>
    <!-- Speech bubble with a tail: MentorJ is a chat-first teaching assistant. -->
    <path d="M11 33 8 38.5 20 33.5Z" fill="url(#mentorj)"/>
    <rect x="6" y="18" width="28" height="14.5" rx="5" stroke="url(#mentorj)" stroke-width="3"/>
</svg>
