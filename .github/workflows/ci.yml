name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Validate the checked-in Gradle wrapper before executing it.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Build
        run: ./gradlew build

      - name: Test
        run: ./gradlew test

      - name: Verify plugin
        run: ./gradlew verifyPlugin
